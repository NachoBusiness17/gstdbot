# ═══════════════════════════════════════════════════════
# GSTD Node OS — Docker Compose
#
# One command to run your sovereign AI node:
#   docker compose up -d
#
# Dashboard: http://localhost:8080
# ═══════════════════════════════════════════════════════

services:
  gstd-node:
    image: gstd-node:local
    build: .
    container_name: gstd-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gstd-data:/data/gstdbot
    environment:
      - NODE_ENV=production
      - GSTD_API_PORT=8080
      - SWARM_ENABLED=true
      - GSTD_MEMORY=false
      - OLLAMA_URL=http://host.docker.internal:11434
      - GSTD_WALLET_ADDRESS=${GSTD_WALLET_ADDRESS:-}
      # Optional: Set your node name
      # - NODE_NAME=my-gstd-node
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gstd-data:
    driver: local

ru:{title:'Панель ноды',payments:'Баланс и выплаты ↗',intro:'Модели, нагрузка и обслуживание вашей ноды в одном месте. По умолчанию запросы выполняются локально.',access:'Вход оператора',accessHint:'Введите PIN этой ноды (8–12 цифр для нового PIN). При первом запуске нужен также токен настройки с машины: ~/.config/gstdbot/setup-token. Не передавайте его другим.',pin:'PIN',setup:'Токен первого запуска (только при настройке)',signIn:'Войти',create:'Настроить первый вход',refresh:'Обновить данные',logout:'Выйти',cpu:'Загрузка CPU',ram:'Используется RAM',capacity:'Занято слотов',requests:'HTTP-запросов после запуска',statsHint:'Данные этой машины. Обновление раз в 30 секунд только при открытой панели; внешние API при этом не опрашиваются. Запросы и время работы обнуляются при перезапуске.',wallet:'Кошелёк начислений',walletHint:'Вставьте адрес своего TON-кошелька (например, из Tonkeeper) и нажмите «Привязать мой кошелёк». Seed-фраза не нужна. Привязка определяет получателя только новых наград.',address:'Публичный TON-адрес',bind:'Привязать мой кошелёк',walletLock:'Адрес уже закреплён за этой нодой. Его замена требует отдельной миграции и пока недоступна в панели. Старые балансы не переносятся при смене адреса.',balance:'Открыть учёт, награды и вывод на платформе ↗',moneyHint:'Только принятая оплаченная работа: 85% исполнителю, 10% протоколу, 5% резерву. Локальный чат и бесплатные запросы не создают наград. Указание адреса не доказывает владение кошельком; вывод требует авторизации на платформе.',updates:'Обновление ноды',updateHint:'Проверка выполняется по нажатию. Обновление из исходников сохраняет конфигурацию и ключи, проверяет сборку и отказывается перезаписывать изменённые файлы.',check:'Проверить версию',updateConsent:'Обновить исходники и перезапустить эту ноду',apply:'Установить обновление',containerHint:'Для Docker пересоберите образ через docker compose build и docker compose up -d на машине. Обновление из панели требует Git, npm и менеджер перезапуска процесса.',models:'Локальные модели',modelHint:'Список показывает установленные модели Ollama. Загрузка может занимать минуты и расходует трафик и диск. Размер модели должен соответствовать RAM вашей машины.',modelName:'Название модели в Ollama',install:'Скачать модель',chat:'Проверить модель',model:'Модель',routing:'Маршрут',local:'Только эта нода',network:'Разрешить другие ноды GSTD',privacyHint:'В сетевом режиме запрос может быть передан выбранному исполнителю. Корпоративного резервного ИИ в ноде нет.',question:'Ваш запрос',send:'Отправить',guide:'Инструкция оператора ↗',data:'Управление данными ↗',registered:'Зарегистрирована на платформе',offline:'Не зарегистрирована на платформе',noWallet:'Адрес пока не настроен',noModels:'Нет установленных моделей',ollamaDown:'Ollama недоступна. Проверьте её запуск на машине.',running:'В памяти',installed:'На диске',working:'Выполняется…',done:'Готово',failed:'Не удалось выполнить запрос',empty:'Пустой ответ',syncPending:'Адрес сохранён локально. Регистрация пока не подтверждена; нода повторит попытку. Оплаченная работа ещё недоступна.',saved:'Адрес сохранён, регистрация подтверждена.',upToDate:'Установлена актуальная версия.',updateFound:'Доступно обновление',checkFailed:'Не удалось проверить обновление',restarting:'Обновление установлено. Нода перезапускается; войдите снова после запуска.',invalidModel:'Укажите допустимое название модели Ollama.',sessionExpired:'Сессия истекла. Войдите снова.',busy:'Нода занята вычислением. Дождитесь завершения.',migration:'Для смены существующего адреса требуется отдельная миграция.',invalidAddress:'Проверьте TON-адрес.',uptime:'Время работы',load:'Нагрузка за 1 мин.',freeDisk:'Свободно на диске',heartbeat:'Последний heartbeat'},
en:{title:'Node dashboard',payments:'Balance & payouts ↗',intro:'Models, load and maintenance in one place. Requests run locally by default.',access:'Operator sign-in',accessHint:'Enter this node’s PIN (8–12 digits for a new PIN). First setup also requires the machine’s setup token: ~/.config/gstdbot/setup-token. Keep it private.',pin:'PIN',setup:'First-run setup token (setup only)',signIn:'Sign in',create:'Set up first sign-in',refresh:'Refresh',logout:'Sign out',cpu:'CPU usage',ram:'RAM used',capacity:'Active slots',requests:'HTTP requests since start',statsHint:'Measurements from this machine. Refreshes every 30 seconds while this panel is visible; no external API polling. Request count and uptime reset on restart.',wallet:'Earning wallet',walletHint:'Paste your own TON wallet address (for example, from Tonkeeper) and select Bind my wallet. No seed phrase is needed. The link selects the recipient of new rewards only.',address:'Public TON address',bind:'Bind my wallet',walletLock:'This address is already bound to the node. Replacing it requires a separate migration and is not yet available in this panel. Existing balances do not move when an address changes.',balance:'Open accounting, rewards & withdrawals ↗',moneyHint:'Funded accepted work only: 85% executor, 10% protocol, 5% reserve. Local chat and free requests create no rewards. Entering an address does not prove wallet ownership; withdrawals require platform authentication.',updates:'Node updates',updateHint:'Checks run on demand. Source updates preserve configuration and keys, validate the build and refuse to overwrite modified tracked files.',check:'Check for updates',updateConsent:'Update source and restart this node',apply:'Install update',containerHint:'For Docker, rebuild with docker compose build and docker compose up -d on the machine. Dashboard updates require Git, npm and a process restart manager.',models:'Local models',modelHint:'Installed Ollama models. Downloads can take minutes and use bandwidth and disk space. Choose a model that fits this machine’s RAM.',modelName:'Ollama model name',install:'Download model',chat:'Test a model',model:'Model',routing:'Routing',local:'This node only',network:'Allow other GSTD nodes',privacyHint:'Network mode may send this request to a selected executor. This node has no corporate AI fallback.',question:'Your request',send:'Send',guide:'Operator guide ↗',data:'Data controls ↗',registered:'Registered on platform',offline:'Not registered on platform',noWallet:'No address configured',noModels:'No installed models',ollamaDown:'Ollama is unavailable. Check its process on the machine.',running:'Loaded in memory',installed:'On disk',working:'Working…',done:'Done',failed:'Request failed',empty:'Empty response',syncPending:'Address saved locally. Registration is not confirmed; the node will retry. Paid work is not available yet.',saved:'Address saved and registration confirmed.',upToDate:'The installed version is current.',updateFound:'Update available',checkFailed:'Could not check for updates',restarting:'Update installed. The node is restarting; sign in again after startup.',invalidModel:'Enter a valid Ollama model name.',sessionExpired:'Session expired. Sign in again.',busy:'Compute is busy. Wait for completion.',migration:'Replacing an existing address requires a separate migration.',invalidAddress:'Check the TON address.',uptime:'Uptime',load:'1-minute load',freeDisk:'Free disk',heartbeat:'Last heartbeat'}
};
let lang=localStorage.getItem('gstd_node_language')||(navigator.language.startsWith('ru')?'ru':'en');if(!TEXT[lang])lang='en';
let token=sessionStorage.getItem('gstd_operator_session')||'',lastStatus=null,update=null, catalog=null, installedIds=new Set(), rewardCurrent=null, rewardRevision=0;
const el=id=>document.getElementById(id),t=k=>TEXT[lang][k]||k;
function notice(s){el('notice').textContent=s||''}
function translate(){document.documentElement.lang=lang;document.title='GSTD · '+t('title');el('language').value=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));if(lastStatus)renderStatus(lastStatus);if(catalog)renderCatalog()}
function errorText(e){if(/newer version of Ollama/i.test(e.message))return t('runtimeOutdated');return TEXT[lang][e.message]||({compute_busy:t('busy'),payout_migration_required:t('migration'),invalid_ton_address:t('invalidAddress')})[e.message]||e.message||t('failed')}
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});if(r.status===401&&token){token='';sessionStorage.removeItem('gstd_operator_session');el('private').classList.add('hidden');el('login').classList.remove('hidden');throw Error(t('sessionExpired'))}return r}
async function api(path,body){const r=await request(path,body),d=await r.json();if(!r.ok)throw Error(d.error||t('failed'));return d}
const bytes=n=>(Number(n||0)/1073741824).toFixed(1)+' GiB';
function renderStatus(d){el('nodeName').textContent=d.name||t('title');el('identity').textContent=d.node_id;el('connection').textContent=t(d.platform.registered?'registered':'offline');el('cpu').textContent=Math.round(d.cpu.usage)+'%';el('ram').textContent=bytes(d.ram.used)+' / '+bytes(d.ram.total);el('capacity').textContent=d.compute.active+' / '+d.compute.capacity;el('requests').textContent=String(d.requests);el('system').textContent=t('uptime')+': '+Math.floor(d.uptime/3600)+'h '+Math.floor(d.uptime/60%60)+'m · '+t('load')+': '+Number(d.cpu.load_1m).toFixed(2)+' · '+t('heartbeat')+': '+(d.platform.lastHeartbeat?new Date(d.platform.lastHeartbeat).toLocaleString(lang):'—');el('payout').textContent=rewardCurrent?.address||t('notLinked');el('identityWallet').textContent=t('identityAddress')+': '+(d.payout_address||t('noWallet'));el('version').textContent='GSTD '+d.version;el('login').classList.add('hidden');el('private').classList.remove('hidden')}
async function status(){lastStatus=await api('/api/node/operator');renderStatus(lastStatus)}
async function models(){const d=await api('/api/ollama/models');installedIds=new Set(d.installed.map(m=>m.id));el('models').replaceChildren();el('model').replaceChildren(new Option('Auto','auto'));if(!d.ollama_available){el('models').textContent=t('ollamaDown');return}if(!d.installed.length)el('models').textContent=t('noModels');for(const m of d.installed){const row=document.createElement('div');row.className='model row';const name=document.createElement('strong');name.textContent=m.id;const detail=document.createElement('span');detail.className='muted';detail.textContent=bytes(m.size)+' · '+t(d.running.includes(m.id)?'running':'installed');row.append(name,detail);el('models').append(row);el('model').add(new Option(m.id,m.id))}if(catalog)renderCatalog()}
async function refresh(){await status();await Promise.all([models(),loadCatalog(),loadRewardWallet()].map(p=>p.catch(e=>notice(errorText(e)))))}
async function login(setup){try{const d=await api(setup?'/api/auth/setup':'/api/auth/login',{pin:el('pin').value,setupToken:el('setup').value});if(!d.token)throw Error(t('failed'));token=d.token;sessionStorage.setItem('gstd_operator_session',token);el('pin').value='';el('setup').value='';await refresh();notice('')}catch(e){notice(errorText(e))}}
el('signIn').onclick=()=>login(false);el('create').onclick=()=>login(true);
el('refresh').onclick=()=>refresh().catch(e=>notice(errorText(e)));el('modelsRefresh').onclick=()=>models().catch(e=>notice(errorText(e)));
el('language').onchange=()=>{lang=el('language').value;localStorage.setItem('gstd_node_language',lang);translate();if(token)models().catch(e=>notice(errorText(e)))};
el('logout').onclick=async()=>{try{await api('/api/auth/logout',{})}catch{}sessionStorage.removeItem('gstd_operator_session');location.reload()};
el('walletConsent').onchange=()=>el('bind').disabled=!el('walletConsent').checked;
el('bind').onclick=async()=>{if(!el('walletConsent').checked)return;el('bind').disabled=true;try{const d=await api('/api/node/reward-wallet',{address:el('walletAddress').value.trim(),revision:rewardRevision});rewardCurrent=d.payout;rewardRevision=d.payout.revision;await status();el('walletConsent').checked=false;notice(t('walletBound'))}catch(e){notice(errorText(e))}finally{el('bind').disabled=!el('walletConsent').checked}};
async function loadRewardWallet(){const d=await api('/api/node/reward-wallet');rewardCurrent=d.payout;rewardRevision=d.payout?.revision||0;if(rewardCurrent)el('walletAddress').value=rewardCurrent.address;if(lastStatus)renderStatus(lastStatus)}

el('check').onclick=async()=>{el('check').disabled=true;el('updateAction').classList.add('hidden');el('updateConsent').checked=false;el('apply').disabled=true;try{update=await api('/api/check-update');if(update.error)throw Error(t('checkFailed'));el('updateInfo').textContent=(update.update_available?t('updateFound'):t('upToDate'))+'\n'+(update.current_hash||update.current_version||'')+' → '+(update.remote_hash||update.latest_version||'')+'\n'+(update.changelog||[]).join('\n');el('updateAction').classList.toggle('hidden',!update.update_available||!update.current_hash)}catch(e){notice(errorText(e))}finally{el('check').disabled=false}};
el('updateConsent').onchange=()=>el('apply').disabled=!el('updateConsent').checked;
el('apply').onclick=async()=>{if(!el('updateConsent').checked)return;el('apply').disabled=true;notice(t('working'));try{await api('/api/update',{});notice(t('restarting'))}catch(e){notice(errorText(e));el('apply').disabled=false}};
el('install').onclick=async()=>{const name=el('installChoice').value||el('newModel').value.trim();if(!/^[a-z0-9:._/-]{1,160}$/i.test(name)){notice(t('invalidModel'));return}el('install').disabled=true;el('download').classList.remove('hidden');el('download').removeAttribute('value');el('downloadInfo').textContent=t('working');try{const r=await request('/api/ollama/models/pull',{model:name});if(!r.ok)throw Error((await r.json()).error||t('failed'));const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',success=false;while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop()||'';for(const event of events){if(!event.startsWith('data: '))continue;const d=JSON.parse(event.slice(6));if(d.error)throw Error(d.error);if(d.total){el('download').value=Math.round(100*(d.completed||0)/d.total);el('downloadInfo').textContent=el('download').value+'%'}else el('downloadInfo').textContent=t('working');if(d.status==='success')success=true}}if(!success)throw Error(t('failed'));el('downloadInfo').textContent=t('done');await refresh()}catch(e){el('downloadInfo').textContent=errorText(e)}finally{el('install').disabled=false;el('download').classList.add('hidden')}};

const extra={

Object.assign(TEXT.ru,extra.ru);Object.assign(TEXT.en,extra.en);
async function loadCatalog(refresh=false){catalog=await api(refresh?'/api/ollama/catalog/refresh':'/api/ollama/catalog',refresh?{}:undefined);renderCatalog()}
function renderCatalog(){
 const selected=el('installChoice').value;el('installChoice').replaceChildren(new Option(t('chooseModel'),''));
 const h=catalog.hardware;el('catalogHardware').textContent='CPU: '+h.cpu_cores+' · RAM: '+bytes(h.total_ram)+' · '+(h.gpu_name||t('noGpuVerified'))+' · '+(h.disk_free===null?'—':bytes(h.disk_free))+' '+t('freeDisk');
 for(const m of catalog.models){const c=m.compatibility;const option=new Option(m.title+' · '+bytes(m.download_bytes)+' · '+t(c.status)+(installedIds.has(m.id)?' · '+t('installed'):''),m.id);el('installChoice').add(option)}
 el('installChoice').value=selected;if(!selected)el('installChoice').value=catalog.models.find(m=>m.compatibility.status==='fits'&&!m.legacy&&!installedIds.has(m.id))?.id||'';modelPlan();
}
function modelPlan(){const m=catalog?.models.find(m=>m.id===el('installChoice').value);el('install').disabled=!!m&&(m.compatibility.status==='insufficient'||installedIds.has(m.id));if(!m){el('modelPlan').textContent='';return}const c=m.compatibility;el('modelPlan').textContent=t(c.status)+' · '+t(c.reason)+'\n'+t('estimatedRAM')+': '+bytes(c.estimated_ram_bytes)+' · '+t('downloadSize')+': '+bytes(m.download_bytes)+'\n'+t(c.acceleration==='gpu_candidate'?'gpuCandidate':'cpuCandidate')+'\n'+t(m.legacy?'legacy':'current')+' · '+t('metadataDate')+': '+new Date(m.verified_at).toLocaleDateString(lang);}
el('installChoice').onchange=()=>{el('newModel').value='';modelPlan()};
el('newModel').oninput=()=>{el('installChoice').value='';el('install').disabled=false;el('modelPlan').textContent=t('unknown')};
el('refreshCatalog').onclick=async()=>{el('refreshCatalog').disabled=true;try{await loadCatalog(true);notice(t('catalogRefreshed'))}catch(e){notice(errorText(e))}finally{el('refreshCatalog').disabled=false}};
el('send').onclick=async()=>{if(!el('question').value.trim())return;el('send').disabled=true;el('answer').textContent=t('working');try{const d=await api('/v1/chat/completions',{model:el('model').value,messages:[{role:'user',content:el('question').value}],privacy:el('privacy').value,max_tokens:512,stream:false});el('answer').textContent=d.choices?.[0]?.message?.content||t('empty')}catch(e){el('answer').textContent=errorText(e)}finally{el('send').disabled=false}};
translate();if(token)refresh().catch(e=>notice(errorText(e)));
setInterval(()=>{if(token&&!document.hidden)status().catch(e=>notice(errorText(e)))},30000);

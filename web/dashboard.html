<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSTD · Панель ноды</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1119;color:#e7edf5;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:30px 20px 60px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:28px;margin:8px 0}h2{font-size:20px;margin:0 0 16px}p,small{color:#acb9cc;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.wide{grid-column:1/-1}section{background:#131b28;border:1px solid #2c3a50;border-radius:16px;padding:24px;margin-top:18px}.grid section{margin-top:0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.metric{background:#1b2637;border-radius:10px;padding:16px}.metric strong{display:block;font-size:22px;margin-top:8px}input,select,textarea,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #425575;background:#172236;color:inherit;max-width:100%}input:not([type=checkbox]),textarea{width:100%;margin:8px 0}textarea{min-height:95px}button{cursor:pointer;background:#344eae}button.secondary{background:#202f45}button:disabled{opacity:.45;cursor:not-allowed}a{color:#b1c5ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px ui-monospace,monospace}label{display:block;margin:12px 0}#notice{padding:12px 0;color:#f0d493;min-height:24px}code{overflow-wrap:anywhere}progress{width:100%;accent-color:#8da9ff}li{margin:12px 0}.muted{color:#acb9cc}.hidden{display:none!important}.pill{padding:6px 10px;border:1px solid #425575;border-radius:20px;font-size:13px}.address{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}#login{max-width:560px}.model{padding:12px 0;border-bottom:1px solid #2c3a50}
@media(max-width:700px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}section{padding:18px}h1{font-size:23px}}
</style></head><body><main>
<header><div><span class="pill">GSTD</span><h1 data-i="title"></h1></div><div class="actions"><select id="language" aria-label="Language"><option value="ru">Русский</option><option value="en">English</option></select><a href="https://app.gstdtoken.com/payments" target="_blank" rel="noreferrer" data-i="payments"></a></div></header>
<p data-i="intro"></p><div id="notice" role="status" aria-live="polite"></div>
<section id="login"><h2 data-i="access"></h2><p data-i="accessHint"></p>
<label><span data-i="pin"></span><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12"></label>
<label><span data-i="setup"></span><input id="setup" type="password" autocomplete="off"></label>
<div class="actions"><button id="signIn" data-i="signIn"></button><button id="create" class="secondary" data-i="create"></button></div></section>
<div id="private" class="hidden">
<section><header><div><h2 id="nodeName"></h2><span id="connection" class="pill"></span></div><div class="actions"><button id="refresh" data-i="refresh"></button><button id="logout" class="secondary" data-i="logout"></button></div></header>
<p id="identity" class="address"></p><div class="metrics"><div class="metric"><span data-i="cpu"></span><strong id="cpu">—</strong></div><div class="metric"><span data-i="ram"></span><strong id="ram">—</strong></div><div class="metric"><span data-i="capacity"></span><strong id="capacity">—</strong></div><div class="metric"><span data-i="requests"></span><strong id="requests">—</strong></div></div><p id="system"></p><small data-i="statsHint"></small></section>
<div class="grid">
<section><h2 data-i="wallet"></h2><p data-i="walletHint"></p><p id="payout" class="address"></p><div id="walletForm"><label><span data-i="address"></span><input id="walletAddress" autocomplete="off" spellcheck="false" placeholder="UQ… / EQ… / 0:…"></label><button id="bind" data-i="bind"></button></div><p id="walletLock" class="hidden" data-i="walletLock"></p><p><a href="https://app.gstdtoken.com/payments" target="_blank" rel="noreferrer" data-i="balance"></a></p><small data-i="moneyHint"></small></section>
<section><h2 data-i="updates"></h2><p id="version"></p><p data-i="updateHint"></p><button id="check" data-i="check"></button><pre id="updateInfo"></pre><div id="updateAction" class="hidden"><label><input id="updateConsent" type="checkbox"> <span data-i="updateConsent"></span></label><button id="apply" data-i="apply" disabled></button></div><small data-i="containerHint"></small></section>
<section class="wide"><header><h2 data-i="models"></h2><button id="modelsRefresh" class="secondary" data-i="refresh"></button></header><p data-i="modelHint"></p><div id="models"></div><label><span data-i="modelName"></span><input id="newModel" list="suggestions" placeholder="qwen2.5:0.5b" autocomplete="off" spellcheck="false"><datalist id="suggestions"><option value="qwen2.5:0.5b"><option value="llama3.2:3b"></datalist></label><button id="install" data-i="install"></button><progress id="download" class="hidden" max="100"></progress><pre id="downloadInfo" role="status"></pre></section>
<section class="wide"><h2 data-i="chat"></h2><label><span data-i="model"></span> <select id="model"><option value="auto">Auto</option></select></label><label><span data-i="routing"></span> <select id="privacy"><option value="local" data-i="local"></option><option value="network" data-i="network"></option></select></label><small data-i="privacyHint"></small><label><span data-i="question"></span><textarea id="question"></textarea></label><button id="send" data-i="send"></button><pre id="answer" aria-live="polite"></pre></section>
</div></div>
<p><a href="https://github.com/gstdcoin/gstdbot/blob/main/docs/OPERATOR_PANEL.md" target="_blank" rel="noreferrer" data-i="guide"></a> · <a href="https://app.gstdtoken.com/privacy" target="_blank" rel="noreferrer" data-i="data"></a></p>
</main><script>
const TEXT={
ru:{title:'Панель ноды',payments:'Баланс и выплаты ↗',intro:'Модели, нагрузка и обслуживание вашей ноды в одном месте. По умолчанию запросы выполняются локально.',access:'Вход оператора',accessHint:'Введите PIN этой ноды (8–12 цифр для нового PIN). При первом запуске нужен также токен настройки с машины: ~/.config/gstdbot/setup-token. Не передавайте его другим.',pin:'PIN',setup:'Токен первого запуска (только при настройке)',signIn:'Войти',create:'Настроить первый вход',refresh:'Обновить данные',logout:'Выйти',cpu:'Загрузка CPU',ram:'Используется RAM',capacity:'Занято слотов',requests:'HTTP-запросов после запуска',statsHint:'Данные этой машины. Обновление раз в 30 секунд только при открытой панели; внешние API при этом не опрашиваются. Запросы и время работы обнуляются при перезапуске.',wallet:'Кошелёк начислений',walletHint:'Укажите публичный TON-адрес собственного кошелька. Нода не запрашивает seed-фразу и не подписывает выплаты.',address:'Публичный TON-адрес',bind:'Сохранить и зарегистрировать',walletLock:'Адрес уже закреплён за этой нодой. Его замена требует отдельной миграции и пока недоступна в панели. Старые балансы не переносятся при смене адреса.',balance:'Открыть учёт, награды и вывод на платформе ↗',moneyHint:'Только принятая оплаченная работа: 85% исполнителю, 10% протоколу, 5% резерву. Локальный чат и бесплатные запросы не создают наград. Указание адреса не доказывает владение кошельком; вывод требует авторизации на платформе.',updates:'Обновление ноды',updateHint:'Проверка выполняется по нажатию. Обновление из исходников сохраняет конфигурацию и ключи, проверяет сборку и отказывается перезаписывать изменённые файлы.',check:'Проверить версию',updateConsent:'Обновить исходники и перезапустить эту ноду',apply:'Установить обновление',containerHint:'Для Docker пересоберите образ через docker compose build и docker compose up -d на машине. Обновление из панели требует Git, npm и менеджер перезапуска процесса.',models:'Локальные модели',modelHint:'Список показывает установленные модели Ollama. Загрузка может занимать минуты и расходует трафик и диск. Размер модели должен соответствовать RAM вашей машины.',modelName:'Название модели в Ollama',install:'Скачать модель',chat:'Проверить модель',model:'Модель',routing:'Маршрут',local:'Только эта нода',network:'Разрешить другие ноды GSTD',privacyHint:'В сетевом режиме запрос может быть передан выбранному исполнителю. Корпоративного резервного ИИ в ноде нет.',question:'Ваш запрос',send:'Отправить',guide:'Инструкция оператора ↗',data:'Управление данными ↗',registered:'Зарегистрирована на платформе',offline:'Не зарегистрирована на платформе',noWallet:'Адрес пока не настроен',noModels:'Нет установленных моделей',ollamaDown:'Ollama недоступна. Проверьте её запуск на машине.',running:'В памяти',installed:'На диске',working:'Выполняется…',done:'Готово',failed:'Не удалось выполнить запрос',empty:'Пустой ответ',syncPending:'Адрес сохранён локально. Регистрация пока не подтверждена; нода повторит попытку. Оплаченная работа ещё недоступна.',saved:'Адрес сохранён, регистрация подтверждена.',upToDate:'Установлена актуальная версия.',updateFound:'Доступно обновление',checkFailed:'Не удалось проверить обновление',restarting:'Обновление установлено. Нода перезапускается; войдите снова после запуска.',invalidModel:'Укажите допустимое название модели Ollama.',sessionExpired:'Сессия истекла. Войдите снова.',busy:'Нода занята вычислением. Дождитесь завершения.',migration:'Для смены существующего адреса требуется отдельная миграция.',invalidAddress:'Проверьте TON-адрес.',uptime:'Время работы',load:'Нагрузка за 1 мин.',freeDisk:'Свободно на диске',heartbeat:'Последний heartbeat'},
en:{title:'Node dashboard',payments:'Balance & payouts ↗',intro:'Models, load and maintenance in one place. Requests run locally by default.',access:'Operator sign-in',accessHint:'Enter this node’s PIN (8–12 digits for a new PIN). First setup also requires the machine’s setup token: ~/.config/gstdbot/setup-token. Keep it private.',pin:'PIN',setup:'First-run setup token (setup only)',signIn:'Sign in',create:'Set up first sign-in',refresh:'Refresh',logout:'Sign out',cpu:'CPU usage',ram:'RAM used',capacity:'Active slots',requests:'HTTP requests since start',statsHint:'Measurements from this machine. Refreshes every 30 seconds while this panel is visible; no external API polling. Request count and uptime reset on restart.',wallet:'Earning wallet',walletHint:'Enter the public TON address of your own wallet. The node never asks for a seed phrase or signs withdrawals.',address:'Public TON address',bind:'Save & register',walletLock:'This address is already bound to the node. Replacing it requires a separate migration and is not yet available in this panel. Existing balances do not move when an address changes.',balance:'Open accounting, rewards & withdrawals ↗',moneyHint:'Funded accepted work only: 85% executor, 10% protocol, 5% reserve. Local chat and free requests create no rewards. Entering an address does not prove wallet ownership; withdrawals require platform authentication.',updates:'Node updates',updateHint:'Checks run on demand. Source updates preserve configuration and keys, validate the build and refuse to overwrite modified tracked files.',check:'Check for updates',updateConsent:'Update source and restart this node',apply:'Install update',containerHint:'For Docker, rebuild with docker compose build and docker compose up -d on the machine. Dashboard updates require Git, npm and a process restart manager.',models:'Local models',modelHint:'Installed Ollama models. Downloads can take minutes and use bandwidth and disk space. Choose a model that fits this machine’s RAM.',modelName:'Ollama model name',install:'Download model',chat:'Test a model',model:'Model',routing:'Routing',local:'This node only',network:'Allow other GSTD nodes',privacyHint:'Network mode may send this request to a selected executor. This node has no corporate AI fallback.',question:'Your request',send:'Send',guide:'Operator guide ↗',data:'Data controls ↗',registered:'Registered on platform',offline:'Not registered on platform',noWallet:'No address configured',noModels:'No installed models',ollamaDown:'Ollama is unavailable. Check its process on the machine.',running:'Loaded in memory',installed:'On disk',working:'Working…',done:'Done',failed:'Request failed',empty:'Empty response',syncPending:'Address saved locally. Registration is not confirmed; the node will retry. Paid work is not available yet.',saved:'Address saved and registration confirmed.',upToDate:'The installed version is current.',updateFound:'Update available',checkFailed:'Could not check for updates',restarting:'Update installed. The node is restarting; sign in again after startup.',invalidModel:'Enter a valid Ollama model name.',sessionExpired:'Session expired. Sign in again.',busy:'Compute is busy. Wait for completion.',migration:'Replacing an existing address requires a separate migration.',invalidAddress:'Check the TON address.',uptime:'Uptime',load:'1-minute load',freeDisk:'Free disk',heartbeat:'Last heartbeat'}
};
let lang=localStorage.getItem('gstd_node_language')||(navigator.language.startsWith('ru')?'ru':'en');if(!TEXT[lang])lang='en';
let token=sessionStorage.getItem('gstd_operator_session')||'',lastStatus=null,update=null;
const el=id=>document.getElementById(id),t=k=>TEXT[lang][k]||k;
function notice(s){el('notice').textContent=s||''}
function translate(){document.documentElement.lang=lang;document.title='GSTD · '+t('title');el('language').value=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));if(lastStatus)renderStatus(lastStatus)}
function errorText(e){return ({compute_busy:t('busy'),payout_migration_required:t('migration'),invalid_ton_address:t('invalidAddress')})[e.message]||e.message||t('failed')}
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});if(r.status===401&&token){token='';sessionStorage.removeItem('gstd_operator_session');el('private').classList.add('hidden');el('login').classList.remove('hidden');throw Error(t('sessionExpired'))}return r}
async function api(path,body){const r=await request(path,body),d=await r.json();if(!r.ok)throw Error(d.error||t('failed'));return d}
const bytes=n=>(Number(n||0)/1073741824).toFixed(1)+' GiB';
function renderStatus(d){el('nodeName').textContent=d.name||t('title');el('identity').textContent=d.node_id;el('connection').textContent=t(d.platform.registered?'registered':'offline');el('cpu').textContent=Math.round(d.cpu.usage)+'%';el('ram').textContent=bytes(d.ram.used)+' / '+bytes(d.ram.total);el('capacity').textContent=d.compute.active+' / '+d.compute.capacity;el('requests').textContent=String(d.requests);el('system').textContent=t('uptime')+': '+Math.floor(d.uptime/3600)+'h '+Math.floor(d.uptime/60%60)+'m · '+t('load')+': '+Number(d.cpu.load_1m).toFixed(2)+' · '+t('heartbeat')+': '+(d.platform.lastHeartbeat?new Date(d.platform.lastHeartbeat).toLocaleString(lang):'—');el('payout').textContent=d.payout_address||t('noWallet');el('walletForm').classList.toggle('hidden',!!d.payout_address);el('walletLock').classList.toggle('hidden',!d.payout_address);el('version').textContent='GSTD '+d.version;el('login').classList.add('hidden');el('private').classList.remove('hidden')}
async function status(){lastStatus=await api('/api/node/operator');renderStatus(lastStatus)}
async function models(){const d=await api('/api/ollama/models');el('models').replaceChildren();el('model').replaceChildren(new Option('Auto','auto'));if(!d.ollama_available){el('models').textContent=t('ollamaDown');return}if(!d.installed.length)el('models').textContent=t('noModels');for(const m of d.installed){const row=document.createElement('div');row.className='model row';const name=document.createElement('strong');name.textContent=m.id;const detail=document.createElement('span');detail.className='muted';detail.textContent=bytes(m.size)+' · '+t(d.running.includes(m.id)?'running':'installed');row.append(name,detail);el('models').append(row);el('model').add(new Option(m.id,m.id))}}
async function refresh(){await status();await models()}
async function login(setup){try{const d=await api(setup?'/api/auth/setup':'/api/auth/login',{pin:el('pin').value,setupToken:el('setup').value});if(!d.token)throw Error(t('failed'));token=d.token;sessionStorage.setItem('gstd_operator_session',token);el('pin').value='';el('setup').value='';await refresh();notice('')}catch(e){notice(errorText(e))}}
el('signIn').onclick=()=>login(false);el('create').onclick=()=>login(true);
el('refresh').onclick=()=>refresh().catch(e=>notice(errorText(e)));el('modelsRefresh').onclick=()=>models().catch(e=>notice(errorText(e)));
el('language').onchange=()=>{lang=el('language').value;localStorage.setItem('gstd_node_language',lang);translate();if(token)models().catch(e=>notice(errorText(e)))};
el('logout').onclick=async()=>{try{await api('/api/auth/logout',{})}catch{}sessionStorage.removeItem('gstd_operator_session');location.reload()};
el('bind').onclick=async()=>{el('bind').disabled=true;try{const d=await api('/api/node/payout-address',{address:el('walletAddress').value.trim()});await status();notice(t(d.platform_synced?'saved':'syncPending'))}catch(e){notice(errorText(e))}finally{el('bind').disabled=false}};
el('check').onclick=async()=>{el('check').disabled=true;el('updateAction').classList.add('hidden');el('updateConsent').checked=false;el('apply').disabled=true;try{update=await api('/api/check-update');if(update.error)throw Error(t('checkFailed'));el('updateInfo').textContent=(update.update_available?t('updateFound'):t('upToDate'))+'\n'+(update.current_hash||update.current_version||'')+' → '+(update.remote_hash||update.latest_version||'')+'\n'+(update.changelog||[]).join('\n');el('updateAction').classList.toggle('hidden',!update.update_available||!update.current_hash)}catch(e){notice(errorText(e))}finally{el('check').disabled=false}};
el('updateConsent').onchange=()=>el('apply').disabled=!el('updateConsent').checked;
el('apply').onclick=async()=>{if(!el('updateConsent').checked)return;el('apply').disabled=true;notice(t('working'));try{await api('/api/update',{});notice(t('restarting'))}catch(e){notice(errorText(e));el('apply').disabled=false}};
el('install').onclick=async()=>{const name=el('newModel').value.trim();if(!/^[a-z0-9:._/-]{1,160}$/i.test(name)){notice(t('invalidModel'));return}el('install').disabled=true;el('download').classList.remove('hidden');el('download').removeAttribute('value');el('downloadInfo').textContent=t('working');try{const r=await request('/api/ollama/models/pull',{model:name});if(!r.ok)throw Error((await r.json()).error||t('failed'));const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',success=false;while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop()||'';for(const event of events){if(!event.startsWith('data: '))continue;const d=JSON.parse(event.slice(6));if(d.error)throw Error(d.error);if(d.total){el('download').value=Math.round(100*(d.completed||0)/d.total);el('downloadInfo').textContent=el('download').value+'%'}else el('downloadInfo').textContent=t('working');if(d.status==='success')success=true}}if(!success)throw Error(t('failed'));el('downloadInfo').textContent=t('done');await refresh()}catch(e){el('downloadInfo').textContent=errorText(e)}finally{el('install').disabled=false;el('download').classList.add('hidden')}};
el('send').onclick=async()=>{if(!el('question').value.trim())return;el('send').disabled=true;el('answer').textContent=t('working');try{const d=await api('/v1/chat/completions',{model:el('model').value,messages:[{role:'user',content:el('question').value}],privacy:el('privacy').value,max_tokens:512,stream:false});el('answer').textContent=d.choices?.[0]?.message?.content||t('empty')}catch(e){el('answer').textContent=errorText(e)}finally{el('send').disabled=false}};
translate();if(token)refresh().catch(e=>notice(errorText(e)));
setInterval(()=>{if(token&&!document.hidden)status().catch(e=>notice(errorText(e)))},30000);
</script></body></html>
